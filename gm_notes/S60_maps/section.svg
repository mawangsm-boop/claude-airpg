<text x="60" y="384" font-size="12" fill="#993C1D">주황 점선 아래(갈림목·왼쪽 길·호숫가)만 봄에 잠긴다. 코볼드 옛 굴과 묻힌 옛 지하실은 그 위.</text>
<text x="60" y="398" font-size="12" fill="#185FA5">파란 화살표: 구릉의 물이 오른쪽 길로 내려와 갈림목에서 합쳐져 호수로 든다.</text>
